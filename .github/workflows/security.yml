name: Security & Lint

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly Monday 06:00 UTC re-scan to catch newly published CVEs.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: npm audit + lint (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [client, server]
    defaults:
      run:
        working-directory: src/${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/${{ matrix.workspace }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high+ severity, prod only)
        run: npm run audit:ci

      - name: Lint
        if: matrix.workspace == 'client'
        run: npm run lint

      # SBOM generation — CycloneDX format. Uploaded as an artifact for
      # supply-chain visibility. Run `npm run sbom` locally to reproduce.
      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        run: npm run sbom
        continue-on-error: true

      - name: Upload SBOM artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.workspace }}
          path: src/${{ matrix.workspace }}/sbom.json
          if-no-files-found: ignore

  build-client:
    name: Build client
    runs-on: ubuntu-latest
    needs: audit
    defaults:
      run:
        working-directory: src/client
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/client/package-lock.json
      - run: npm ci
      - run: npm run build
